name: VoiceOps
options:
  bundleIdPrefix: com.voiceops
settings:
  MARKETING_VERSION: 0.3.0
  CURRENT_PROJECT_VERSION: 4
schemes:
  VoiceOps:
    build:
      targets:
        VoiceOps: all
    run:
      config: Debug

targets:
  VoiceOps:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: VoiceOps
      - path: VoiceOpsCore
    resources:
      - path: VoiceOps/Assets.xcassets
    info:
      path: VoiceOps/Info.plist
      properties:
        CFBundleDisplayName: inVoice
        NSBluetoothAlwaysUsageDescription: inVoice uses Bluetooth only to securely configure Wi-Fi on a nearby wireless voice board.
        NSBonjourServices:
          - _mlxvoice._tcp
        NSLocalNetworkUsageDescription: inVoice connects to your wireless voice board for audio, controls, and firmware updates.
        NSMicrophoneUsageDescription: inVoice needs microphone access only while you dictate.
        LSUIElement: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voiceops.VoiceOps
        PRODUCT_NAME: inVoice
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        OTHER_CODE_SIGN_FLAGS: "--requirements $(SRCROOT)/VoiceOps/VoiceOps.requirements"
        INFOPLIST_FILE: VoiceOps/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CONFIGURATION_BUILD_DIR: $(PROJECT_DIR)/Build/$(CONFIGURATION)
