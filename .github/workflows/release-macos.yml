name: Release macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          app_version="$(awk '/MARKETING_VERSION:/ { print $2; exit }' apps/macos/project.yml)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$app_version" != "$tag_version" ]]; then
            echo "Tag $tag_version does not match app version $app_version" >&2
            exit 1
          fi

      - name: Build and package inVoice
        run: ./scripts/package_macos_release.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: inVoice-macOS
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.dmg \
            dist/*.sha256 \
            --generate-notes \
            --title "inVoice $GITHUB_REF_NAME"
